server:
  port: 8080

spring:
  application:
    name: api-gateway
 
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ── Usuarios ──
        - id: users-service
          uri: ${USERS_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth, /api/auth/**, /api/personas, /api/personas/**, /api/documents, /api/documents/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

        # ── Specialist (NestJS) ──
        - id: specialist-service
          uri: ${SPECIALIST_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/specialist, /api/specialist/**, /api/appointment, /api/appointment/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

        # ── Euphoria / Sanity Agent (Python) ──
        - id: euphoria-service
          uri: ${EUPHORIA_SERVICE_URI:http://localhost:5000}
          predicates:
            - Path=/api/euphoria, /api/euphoria/**
          filters:
            - RewritePath=/api/euphoria/(?<segment>.*), /$\{segment}

        # ── Diario ──
        - id: diary-service
          uri: ${DIARY_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/diary, /api/diary/**, /api/habits, /api/habits/**, /api/album, /api/album/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

        # ── Notificaciones ──
        - id: notifications-service
          uri: ${NOTIFICATIONS_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/recovery, /api/recovery/**, /api/notifications, /api/notifications/**, /api/tokens, /api/tokens/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

jwt:
  secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaJWTDebeSerMuyLarga123456789}

gateway:
  open-endpoints:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/register-therapist
    - /api/auth/google
    - /api/recovery/forgot-password
    - /api/recovery/reset-password
    - /api/personas/exists
    - /api/personas/reset-password
