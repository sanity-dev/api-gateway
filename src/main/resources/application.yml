server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ── Usuarios (Spring Boot) ──
        - id: users-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/personas/**, /api/documents/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

        # ── Specialist (NestJS) ──
        - id: specialist-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/specialist/**, /api/appointment/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

        # ── Euphoria (Python) ──
        - id: euphoria-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/euphoria/**
          filters:
            - RewritePath=/api/euphoria/(?<segment>.*), /$\{segment}

        # ── Diario (Spring Boot) ──
        - id: diary-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/diary/**, /api/habits/**, /api/album/**
          filters:
            - RewritePath=/(?<segment>.*), /$\{segment}

jwt:
  secret: MiClaveSecretaSuperSeguraParaJWTDebeSerMuyLarga123456789

gateway:
  open-endpoints:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/register-therapist
    - /api/auth/google
    - /api/auth/forgot-password